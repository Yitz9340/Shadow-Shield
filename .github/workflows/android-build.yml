name: Build ShadowShield APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle wrapper
      run: |
        curl -L -o gradle/wrapper/gradle-wrapper.jar \
          https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar
        sed -i 's|DEFAULT_JVM_OPTS=.*|DEFAULT_JVM_OPTS="-Xmx512m -Xms128m"|' gradlew
        chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace --no-build-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ShadowShield-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30