name: Build ShadowShield APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Fix gradlew
      run: |
        cat > gradlew << 'GRADLEW_EOF'
        #!/bin/sh
        APP_HOME=$(dirname "$0")
        CLASSPATH="$APP_HOME/gradle/wrapper/gradle-wrapper.jar"
        exec "$JAVA_HOME/bin/java" -Xmx512m -Xms128m \
          "-Dorg.gradle.appname=gradle" \
          -classpath "$CLASSPATH" \
          org.gradle.wrapper.GradleWrapperMain "$@"
        GRADLEW_EOF
        chmod +x gradlew

    - name: Check files exist
      run: |
        echo "=== Checking critical files ==="
        ls -la build.gradle || echo "MISSING: build.gradle"
        ls -la settings.gradle || echo "MISSING: settings.gradle"
        ls -la app/build.gradle || echo "MISSING: app/build.gradle"
        ls -la gradlew || echo "MISSING: gradlew"
        echo "=== Done ==="

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ShadowShield-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
