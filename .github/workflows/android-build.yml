name: Build ShadowShield APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Check files exist
      run: |
        echo "=== Checking critical files ==="
        ls -la build.gradle || echo "MISSING: build.gradle"
        ls -la settings.gradle || echo "MISSING: settings.gradle"
        ls -la app/build.gradle || echo "MISSING: app/build.gradle"
        echo "=== Done ==="

    - name: Build with Gradle
      run: gradle assembleDebug --stacktrace
      env:
        GRADLE_OPTS: -Dorg.gradle.daemon=false

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ShadowShield-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

